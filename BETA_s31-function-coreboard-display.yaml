spi:
  - id: display_spi
    clk_pin: GPIO49   # SCL
    mosi_pin: GPIO47  # SDA

display:
  - platform: mipi_spi
    id: main_display
    spi_id: display_spi
    model: ST7789V
    data_rate: 40MHz
    spi_mode: MODE3  # Needed with CS tied low
    dc_pin: GPIO43
    reset_pin: GPIO45
    dimensions:
      width: 240
      height: 240
      offset_width: ${display_offset_width}
      offset_height: ${display_offset_height}
    transform:
      swap_xy: ${display_swap_xy}
      mirror_x: ${display_mirror_x}
      mirror_y: ${display_mirror_y}
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

