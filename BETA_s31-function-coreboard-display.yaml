    name: Show Seconds
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: clock_hms
      - script.execute: analog_clock_redraw
      - script.execute: retro_clock_redraw
    on_turn_off:
      - component.update: clock_hms
      - script.execute: analog_clock_redraw
      - script.execute: retro_clock_redraw

  # Tick marks on the analog clock
  - platform: template
    id: clock_show_gfx
    name: Show GFX
    icon: "mdi:radar"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: analog_clock_redraw
    on_turn_off:
      - script.execute: analog_clock_redraw

  # Weather icon and temperature (digital and analog clocks)
  - platform: template
    id: clock_show_weather
    name: Show Weather
    icon: "mdi:weather-partly-cloudy"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: weather_line
    on_turn_off:
      - component.update: weather_line

  # The scrolling temperature, feels like and wind line (digital clock)
  - platform: template
    id: clock_show_feels_like
