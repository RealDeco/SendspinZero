binary_sensor:
  - platform: gpio
    id: boot_button
    name: "Boot Button"
    pin:
      number: GPIO61
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at most 300ms
          - ON for at most 1s
          - OFF for at least 50ms
        then:
          - media_player.toggle: sendspin_group_media_player
      - timing:
          - ON for at most 1s
          - OFF for at least 300ms
        then:
          - script.execute: reset_led
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      not:
                        voice_assistant.is_running:
                    then:
                      - voice_assistant.start:
                    else:
                      - voice_assistant.stop:
                      - script.execute:
                          id: set_va_phase
                          phase: ${va_phase_idle}

  # Rooms clock
  - platform: homeassistant
    id: room1_presence
    entity_id: ${sensor1_entity}
    on_state:
      - script.execute: rooms_grid_apply
  - platform: homeassistant
    id: room1_light
    entity_id: ${light1_entity}
