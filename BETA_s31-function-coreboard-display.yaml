lvgl:
  displays:
    - main_display
  buffer_size: 12%
  color_depth: 16
  bg_color: 0x000000
  default_font: font_display

  animations:
    - id: album_art_crossfade
      duration: 1500ms
      widgets:
        - id: outgoing_art
          opa:
            from: 100%
            to: 0%
      on_stop:
        - sendspin.image.transition_finished: album_slot

  # Above every page: the voice assistant phase image and the mute icon (the pairing overlay goes on top)
  top_layer:
    widgets:
      - obj:
          id: va_overlay
          align: CENTER
          width: 240
          height: 240
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          clickable: false
          hidden: true
          widgets:
            - image:
                id: va_image
                align: CENTER
                src: va_loading_image
                antialias: false
                clickable: false

      - image:
          id: va_mute_icon
          align: BOTTOM_RIGHT
          src: va_mute_image
          antialias: false
          clickable: false
          hidden: true

  pages:
    - id: boot_sound_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: "Home Connected"
            text_color: 0xFFFFFF
            text_font: font_boot
            width: 230
            long_mode: WRAP
            text_align: CENTER

    - id: idle_page
      bg_color: 0x000000
      # Labels only update while this page shows, so refresh them when it comes back
      on_load:
        - component.update: clock_hms
        - component.update: clock_date
        - component.update: weather_temp_big
        - component.update: weather_line
      widgets:
        - image:
            id: standby_background_widget
