    dither: NONE
  - platform: file
    file: ${loading_illustration_file}
    id: va_loading_image
    resize: 240x240
    type: RGB565
    dither: NONE
  # Small corner icon while muted
  - platform: file
    file: ${mute_illustration_file}
    id: va_mute_image
    resize: 40x40
    type: RGB565
    dither: NONE

  # Album art from Music Assistant, cross-faded on track change
  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: 216x216
    display_offset: 1s
    current_image:
      id: album_art
    transition_image:
      id: album_art_transition
    on_image_display:
      - lambda: |-
          id(sendspin_album_art_valid) = true;
      - if:
          condition:
            lambda: 'return id(last_album_art_valid);'
          then:
            - lvgl.image.update:
                id: outgoing_art
                src: album_art_transition
          else:
            - lvgl.image.update:
                id: outgoing_art
                src: fallback_playing_image
      - lvgl.image.update:
          id: incoming_art
          src: album_art
      - lvgl.animation.start: album_art_crossfade
    on_image_clear:
      - lambda: |-
          id(sendspin_album_art_valid) = false;
      - lvgl.image.update:
          id: incoming_art
          src: fallback_playing_image
      - lvgl.animation.start: album_art_crossfade
    on_image_error:
      - logger.log:
          format: "Album art error"
          level: WARN
      - lambda: |-
          id(sendspin_album_art_valid) = false;

  # Family Photo clock; the URL is set from Home Assistant
  - platform: online_image
    id: family_photo_image
    url: https://raw.githubusercontent.com/RealDeco/sendspin-guition/main/images/family_photo1.png
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            lambda: 'return id(clock_style_mode) == ${clock_style_photo};'
          then:
            - lvgl.image.update:
                id: photo_clock_image_widget
                src: family_photo_image
            - lvgl.widget.show: photo_clock_image_widget
    on_error:
      - logger.log:
          format: "Family photo failed to load"
          level: WARN

  # Clock background, picked from Home Assistant
  - platform: online_image
    id: standby_background_image
    url: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/Other/240x240/clock.png
    format: PNG
    type: RGB565
    resize: ${imagewidth}x${imageheight}
    update_interval: never
    on_download_finished:
      - if:
          condition:
            switch.is_on: standby_background_enabled
          then:
            - lvgl.image.update:
                id: standby_background_widget
                src: standby_background_image
            - lvgl.widget.show: standby_background_widget

# Downloads for the online images
http_request:

audio_file:
  - id: timer_finished_sound
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  - id: ready_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${startup_sound_file}.flac
  - id: wake_word_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/${wakeup_sound}.flac

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_source
    static_delay_adjustable: true

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: "Sendspin Player"

  - platform: speaker_source
    id: usb_media_player
    name: "Player"

    announcement_pipeline:
      speaker: va_format_resampler
      format: FLAC     # Least CPU-intensive codec
      num_channels: 1  # Voice is mono
      sample_rate: 48000
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # Least CPU-intensive codec
      num_channels: 2
      sample_rate: 48000
      sources:
        - http_media_source
        - sendspin_source

    on_announcement:
      - script.stop: mp_idle_debounce
      - mixer_speaker.apply_ducking:  # Lower music under announcements
          id: usb_media_input
          decibel_reduction: 20
          duration: 0.0s
      - mixer_speaker.apply_ducking:
          id: onboard_media_input
          decibel_reduction: 20
          duration: 0.0s
      # On device the wake word keeps running, so "stop" can be heard
      - if:
          condition:
            and:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
              - microphone.is_capturing: ${va_microphone}
          then:
            - script.execute: stop_wake_word
            - wait_until:
                - not:
                    voice_assistant.is_running:

    on_play:
      - script.stop: mp_idle_debounce
      - if:
          condition:
            and:
              - microphone.is_capturing: ${va_microphone}
              - switch.is_off: wake_word_during_music
          then:
            - script.execute: stop_wake_word
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      condition:
                        - not:
                            voice_assistant.is_running:
      - lvgl.page.show: sendspin_page
      - script.execute: music_led
      - if:
          condition:
            lambda: 'return id(playing_internal_sound);'
          then:
            - lambda: 'id(playing_internal_sound) = false;'

    on_idle:
      - script.execute: mp_idle_debounce

    # Only URL playback pauses (Sendspin goes idle instead); paused counts as idle for the wake word
    on_pause:
      - script.execute: mp_idle_debounce

    on_state:
      # Not during a voice session (e.g. after the wake sound): voice_assistant on_end brings the music back.
      # id(va).is_running(), not the voice_assistant.is_running condition, which is also true while continuous
      # mode ("In Home Assistant" wake word) is only armed.
      - if:
          condition:
            and:
              - not:
                  media_player.is_announcing:
                    id: usb_media_player
              - lambda: return !id(va).is_running();
          then:
            - mixer_speaker.apply_ducking:  # Bring music back after announcements
                id: usb_media_input
                decibel_reduction: 0
                duration: 1.0s
            - mixer_speaker.apply_ducking:
                id: onboard_media_input
                decibel_reduction: 0
                duration: 1.0s

micro_wake_word:
  id: mww
  microphone: ${va_microphone}
  stop_after_detection: false  # Keep listening during replies so "stop" can be heard
  ring_buffer_duration: 800ms  # Per esphome#20942, ~25.6 KB; stops "Not enough free bytes in ring buffer"
  models:
    - okay_nabu
    - hey_jarvis
    # Only enabled while a TTS reply plays or a timer rings
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          - if:
              condition:
                voice_assistant.is_running:
              then:
                - voice_assistant.stop:
                - script.execute:
                    id: set_va_phase
                    phase: ${va_phase_idle}
              else:
                - if:
                    condition:
                      media_player.is_announcing:
                        id: usb_media_player
                    then:
                      - media_player.stop:
                          announcement: true
                          id: usb_media_player
                    else:
                      - if:
                          condition:
                            switch.is_on: wake_word_sound_switch
                          then:
                            - lambda: 'id(play_sound)->execute(false, std::string("wake_word_sound"));'
                      - script.execute:
                          id: set_va_phase
                          phase: ${va_phase_waiting_for_command}
                      - voice_assistant.start:
                          wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: ${va_microphone}
  media_player: usb_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_start:
    - mixer_speaker.apply_ducking:
        id: usb_media_input
        decibel_reduction: 20
        duration: 0.0s
    - mixer_speaker.apply_ducking:
        id: onboard_media_input
        decibel_reduction: 20
        duration: 0.0s
  on_wake_word_detected:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_waiting_for_command}
  on_listening:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_waiting_for_command}
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: status_led
              blue: 100%
              red: 0%
              green: 0%
              effect: "Slow Pulse"
  on_stt_vad_start:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_listening}
  on_stt_vad_end:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_thinking}
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: status_led
              blue: 100%
              red: 0%
              green: 0%
              effect: "Fast Pulse"
  on_tts_start:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_replying}
    - script.execute: activate_stop_word_once
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: status_led
              blue: 100%
              red: 0%
              green: 0%
              brightness: 100%
              effect: none

  on_end:
    # on_end fires when Home Assistant ends the pipeline, often before the reply starts playing. The VA itself
    # stays out of IDLE until the player reports its reply finished; is_running() ignores continuous mode,
    # unlike the voice_assistant.is_running condition.
    - wait_until:
        condition:
          lambda: return !id(va).is_running();
        timeout: 60s
    - wait_until:
        condition:
          media_player.is_announcing:
            id: usb_media_player
        timeout: 0.5s
    # The VA only goes idle after the reply finished, so this is just the tail; the timeout keeps a hung
    # audio output from leaving the music ducked and the screen on "replying"
    - wait_until:
        condition:
          and:
            - not:
                media_player.is_announcing:
                  id: usb_media_player
            - not:
                speaker.is_playing:
                  id: va_format_resampler
        timeout: 10s
    - mixer_speaker.apply_ducking:
        id: usb_media_input
        decibel_reduction: 0
        duration: 1.0s
    - mixer_speaker.apply_ducking:
        id: onboard_media_input
        decibel_reduction: 0
        duration: 1.0s
    # The reply has finished: hide the phase image (an error, ringing timer or lost connection keeps its own)
    - if:
        condition:
          lambda: return id(va_phase) >= ${va_phase_waiting_for_command} && id(va_phase) <= ${va_phase_replying};
        then:
          - script.execute:
              id: set_va_phase
              phase: ${va_phase_idle}
    # Don't rely on mp_idle_debounce: on the onboard speaker the player goes idle before the VA has ended.
    # Music still playing goes back to its music light.
    - if:
        condition:
          media_player.is_playing: usb_media_player
        then:
          - script.execute: music_led
        else:
          - script.execute: reset_led
    # During music the wake word only comes back when "Wake word during music" is on
    - if:
        condition:
          and:
            - lambda: return id(wake_word_engine_location).current_option() == "On device";
            - or:
                - switch.is_on: wake_word_during_music
                - not:
                    media_player.is_playing: usb_media_player
        then:
          - lambda: id(va).set_use_wake_word(false);
          - script.execute: start_wake_word

  on_error:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_error}
    - mixer_speaker.apply_ducking:
        id: usb_media_input
        decibel_reduction: 0
        duration: 1.0s
    - mixer_speaker.apply_ducking:
        id: onboard_media_input
        decibel_reduction: 0
        duration: 1.0s
    - if:
        condition:
          switch.is_off: mute
        then:
          - script.execute: start_wake_word
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: status_led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 100%
              effect: none
    - delay: 2s
    - script.execute: reset_led
    - if:
        condition:
          lambda: return id(va_phase) == ${va_phase_error};
        then:
          - script.execute:
              id: set_va_phase
              phase: ${va_phase_idle}

  on_client_connected:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_idle}
    - script.execute: start_wake_word

  on_client_disconnected:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_not_ready}
    - script.execute: stop_wake_word

  on_timer_finished:
    - script.execute:
        id: set_va_phase
        phase: ${va_phase_timer_ringing}
    - switch.turn_on: timer_ringing
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: status_led
              red: 0%
              green: 100%
              blue: 0%
              brightness: 100%
              effect: "Fast Pulse"
    - wait_until:
        media_player.is_announcing:
          id: usb_media_player
    - if:
        condition:
          - switch.is_on: use_listen_light
        then:
          - light.turn_on:
              id: status_led
              blue: 0%
              red: 100%
              green: 0%
              effect: "Fast Pulse"

script:
  # Voice assistant phase on the display: one full-screen image on the top layer, over whatever page is
  # showing, hidden again when idle
  - id: set_va_phase
    parameters:
      phase: int
    then:
      - lambda: |-
          id(va_phase) = phase;
          const char *name = "idle";
          switch (phase) {
            case ${va_phase_waiting_for_command}: name = "waiting_for_command"; break;
            case ${va_phase_listening}: name = "listening"; break;
            case ${va_phase_thinking}: name = "thinking"; break;
            case ${va_phase_replying}: name = "replying"; break;
            case ${va_phase_error}: name = "error"; break;
            case ${va_phase_timer_ringing}: name = "timer_ringing"; break;
            case ${va_phase_not_ready}: name = "not_ready"; break;
          }
          ESP_LOGI("va", "Phase: %s", name);
      - if:
          condition:
            lambda: return id(display_ready);
          then:
            - if:
                condition:
                  lambda: return phase == ${va_phase_idle};
                then:
                  - lvgl.widget.hide: va_overlay
                else:
                  - lvgl.image.update:
                      id: va_image
                      src: !lambda |-
                        switch (phase) {
                          case ${va_phase_waiting_for_command}: return id(va_waiting_image);
                          case ${va_phase_listening}: return id(va_listening_image);
                          case ${va_phase_thinking}: return id(va_thinking_image);
                          case ${va_phase_replying}: return id(va_replying_image);
                          case ${va_phase_error}: return id(va_error_image);
                          case ${va_phase_timer_ringing}: return id(va_timer_finished_image);
                          default: return id(va_loading_image);
                        }
                  - lvgl.widget.show: va_overlay

  - id: update_mute_icon
    then:
      - if:
          condition:
            lambda: return id(display_ready);
          then:
            - if:
                condition:
                  switch.is_on: mute
                then:
                  - lvgl.widget.show: va_mute_icon
                else:
                  - lvgl.widget.hide: va_mute_icon

  # Pairing code overlay on top of whatever page is showing
  - id: show_pairing_code
    mode: restart
    parameters:
      code: string
    then:
      - script.stop: hide_pairing_code
      - lambda: |-
          if (id(pairing_overlay) == nullptr) {
            id(pairing_overlay) = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(id(pairing_overlay));
            lv_obj_set_size(id(pairing_overlay), 228, 106);
            lv_obj_center(id(pairing_overlay));
            lv_obj_set_style_bg_color(id(pairing_overlay), lv_color_hex(0x000000), 0);
            lv_obj_set_style_bg_opa(id(pairing_overlay), 235, 0);
            lv_obj_set_style_border_width(id(pairing_overlay), 3, 0);
            lv_obj_set_style_border_color(id(pairing_overlay), lv_color_hex(0x66CCFF), 0);
            lv_obj_set_style_radius(id(pairing_overlay), 18, 0);
            lv_obj_clear_flag(id(pairing_overlay), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(pairing_overlay), LV_OBJ_FLAG_SCROLLABLE);

            lv_obj_t *title = lv_label_create(id(pairing_overlay));
            lv_label_set_text(title, "Sendspin pairing");
            lv_obj_set_style_text_font(title, id(font_display), 0);
            lv_obj_set_style_text_color(title, lv_color_hex(0xB0B0B0), 0);
            lv_obj_align(title, LV_ALIGN_TOP_MID, 0, 10);

            id(pairing_code_label) = lv_label_create(id(pairing_overlay));
            lv_obj_set_style_text_font(id(pairing_code_label), id(font_7seg), 0);
            lv_obj_set_style_text_color(id(pairing_code_label), lv_color_hex(0xFFFF00), 0);
            lv_obj_align(id(pairing_code_label), LV_ALIGN_BOTTOM_MID, 0, -10);
          }

          std::string shown = code;
          if (shown.size() == 6) shown.insert(3, " ");
          lv_label_set_text(id(pairing_code_label), shown.c_str());
          lv_obj_align(id(pairing_code_label), LV_ALIGN_BOTTOM_MID, 0, -10);
          lv_anim_del(id(pairing_overlay), nullptr);
          lv_obj_set_style_opa(id(pairing_overlay), LV_OPA_COVER, 0);
          lv_obj_clear_flag(id(pairing_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(pairing_overlay));

  - id: hide_pairing_code
    mode: restart
    then:
      - lambda: |-
          if (id(pairing_overlay) == nullptr || lv_obj_has_flag(id(pairing_overlay), LV_OBJ_FLAG_HIDDEN)) return;
          lv_anim_del(id(pairing_overlay), nullptr);
          lv_anim_t fade;
          lv_anim_init(&fade);
          lv_anim_set_var(&fade, id(pairing_overlay));
          lv_anim_set_values(&fade, LV_OPA_COVER, LV_OPA_TRANSP);
          lv_anim_set_time(&fade, 260);
          lv_anim_set_exec_cb(&fade, [](void *obj, int32_t opacity) {
            lv_obj_set_style_opa((lv_obj_t *) obj, opacity, 0);
          });
          lv_anim_start(&fade);
      - delay: 280ms
      - lambda: |-
          if (id(pairing_overlay) != nullptr) {
            lv_obj_add_flag(id(pairing_overlay), LV_OBJ_FLAG_HIDDEN);
          }

  # The onboard amp is powered when either output is the onboard speaker
  - id: apply_outputs
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${va_speaker}") == "onboard_announcement_input" ||
                     std::string("${music_speaker}") == "onboard_media_input";
          then:
            - switch.turn_on: onboard_amp
          else:
            - switch.turn_off: onboard_amp

  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 1s
      # Back to the clock page once the player has stayed idle/paused
      - if:
          condition:
            or:
              - media_player.is_idle: usb_media_player
              - media_player.is_paused: usb_media_player
          then:
            - lvgl.page.show: idle_page
      - if:
          condition:
            and:
              - or:
                  - media_player.is_idle: usb_media_player
                  - media_player.is_paused: usb_media_player
              - not:
                  voice_assistant.is_running:
          then:
            - script.execute: reset_led
            - script.execute: start_wake_word

  # While music plays: green slow pulse, or the normal idle light when "Use music light" is off
  - id: music_led
    then:
      - if:
          condition:
            switch.is_on: use_music_light
          then:
            - light.turn_on:
                id: status_led
                blue: 0%
                red: 0%
                green: 100%
                effect: "Slow Pulse"
          else:
            - script.execute: reset_led

  - id: reset_led
    then:
      - if:
          condition:
            - lambda: return id(wake_word_engine_location).current_option() == "On device";
            - switch.is_on: use_listen_light
          then:
            - light.turn_on:
                id: status_led
                red: 100%
                green: 89%
                blue: 71%
                brightness: 30%
                effect: none
          else:
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).current_option() != "On device";
                  - switch.is_on: use_listen_light
                then:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 100%
                      blue: 100%
                      brightness: 30%
                      effect: none
                else:
                  - light.turn_off: status_led

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  - voice_assistant.is_running:
              - not:
                  - micro_wake_word.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: activate_stop_word_once
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: usb_media_player
          timeout: 5s
      - delay: 1s  # Skip the start of the reply
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
      - wait_until:
          not:
            media_player.is_announcing:
              id: usb_media_player
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.disable_model: stop

  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"

  # Repeat the timer sound with a 500 ms gap while the timer rings
  - id: enable_repeat_one
    then:
      - media_player.repeat_one:
          id: usb_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: usb_media_player
          pipeline: announcement
          delay: 500ms

  # Back to normal once the timer is silenced
  - id: disable_repeat
    then:
      - media_player.repeat_off:
          id: usb_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: usb_media_player
          pipeline: announcement
          delay: 0ms

  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: 'return sound_file == "ready_sound";'
          then:
            - lvgl.page.show: boot_sound_page
      - lambda: |-
          id(playing_internal_sound) = true;
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: usb_media_player
                announcement: true
      - lambda: |-
          if ( (id(usb_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(usb_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

  # Clock colours: the accent lights write the globals, then the labels are recoloured
  - id: apply_accent_color_debounced
    mode: restart
    then:
      - delay: 40ms
      - if:
          condition:
            lambda: return id(display_ready);
          then:
            - script.execute: apply_accent_color

  - id: apply_accent_color
    mode: restart
    then:
      - lambda: |-
          auto rgb = [](int r, int g, int b) {
            r = std::max(0, std::min(255, r));
            g = std::max(0, std::min(255, g));
            b = std::max(0, std::min(255, b));
            return lv_color_hex(((uint32_t) r << 16) | ((uint32_t) g << 8) | (uint32_t) b);
          };
          const lv_color_t accent = rgb(id(accent_red), id(accent_green), id(accent_blue));
          const lv_color_t accent2 = rgb(id(accent2_red), id(accent2_green), id(accent2_blue));
          const lv_color_t accent3 = rgb(id(accent3_red), id(accent3_green), id(accent3_blue));
          const lv_color_t accent4 = rgb(id(accent4_red), id(accent4_green), id(accent4_blue));

          lv_obj_set_style_text_color(id(clock_label), accent, 0);
          lv_obj_set_style_text_color(id(clock_ampm_label), accent, 0);
          lv_obj_set_style_text_color(id(photo_clock_label), accent, 0);
          lv_obj_set_style_text_color(id(photo_ampm_label), accent, 0);
          lv_obj_set_style_text_color(id(weather_big_temp), accent, 0);
          lv_obj_set_style_text_color(id(weather_big_temp_unit), accent, 0);
          lv_obj_set_style_text_color(id(analog_weather_temp), accent, 0);
          lv_obj_set_style_text_color(id(date_label), accent2, 0);
          lv_obj_set_style_text_color(id(photo_date_label), accent2, 0);
          lv_obj_set_style_text_color(id(weather_icon), accent2, 0);
          lv_obj_set_style_text_color(id(analog_weather_icon), accent2, 0);
          lv_obj_set_style_text_color(id(weather_label), accent3, 0);
          lv_obj_set_style_text_color(id(cyber_time_label), accent4, 0);
          lv_obj_set_style_text_color(id(rooms_clock_label), accent3, 0);
          lv_obj_set_style_text_color(id(rooms_date_label), accent2, 0);
          for (auto *box : {id(room1_box), id(room2_box), id(room3_box), id(room4_box), id(room5_box), id(room6_box)}) {
            lv_obj_set_style_border_color(box, accent, 0);
