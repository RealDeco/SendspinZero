substitutions:
  startup_sound_file: "Home_Connected" # (options are: available, Home_Connected, Home_Connected_Male, Computer_Ready)
  wakeup_sound: "popup" # (options are: popup, wake_word_triggered)

  va_microphone: usb_voice_mic # (options are: onboard_voice_mic, usb_voice_mic)
  va_speaker: usb_announcement_resampler # Voice replies and sounds (options are: usb_announcement_resampler, onboard_announcement_input)
  music_speaker: usb_media_resampler # Music (options are: usb_media_resampler, onboard_media_input)
  micsource_microphone: usb_mic  # Used by the micsource package

  # Voice assistant images and the fallback image when a track has no album art
  # (options are: AlbertQuackmore,Alfred,Alita,Astrobot,Buzz,Casita,Cybergirl,Dory,EVE,Eyes,Eyes2,GLaDOS,Girl1,Guy1,Guy2
  # Gwen,Gwen_Black,HA-character,ha-girl,Hacker,Harley,Jarvis,Luffy,Mario,Max,Prime,Robochibi,Robocop,Robot,Robotgirl,Salem
  # Sarah,Shaun)
  imagemodel: "Gwen_Black"

  # Home Assistant weather entity for the idle clock page
  ha_weather_entity: weather.forecast_home

  # Rooms clock: presence and light per room (binary sensors in Home Assistant)
  sensor1_entity: "binary_sensor.room_1_presence"
  light1_entity: "binary_sensor.room_1_light"
  sensor2_entity: "binary_sensor.room_2_presence"
  light2_entity: "binary_sensor.room_2_light"
  sensor3_entity: "binary_sensor.room_3_presence"
  light3_entity: "binary_sensor.room_3_light"
  sensor4_entity: "binary_sensor.room_4_presence"
  light4_entity: "binary_sensor.room_4_light"
  sensor5_entity: "binary_sensor.room_5_presence"
  light5_entity: "binary_sensor.room_5_light"
  sensor6_entity: "binary_sensor.room_6_presence"
  light6_entity: "binary_sensor.room_6_light"

  # Display size, used by the clock drawings
  screenwidth: "240"
  screenheight: "240"
  imagewidth: "240"
  imageheight: "240"

  # Display rotation, 0 degree (for 180 degree: mirror_x and mirror_y "true", offset_height "80")
  display_swap_xy: "false"
  display_mirror_x: "false"
  display_mirror_y: "false"
  display_offset_width: "0"
  display_offset_height: "0"

  # Voice assistant images, from the ${imagemodel} folder
  waiting_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/idle.png
  listening_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/listening.png
  thinking_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/thinking.png
  replying_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/replying.png
  error_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/error.png
  timer_finished_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/timer_finished.png
  loading_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/loading.png
  mute_illustration_file: https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/${imagemodel}/240x240/mute.png

  # Voice assistant phases
  va_phase_idle: "0"
  va_phase_waiting_for_command: "1"
  va_phase_listening: "2"
  va_phase_thinking: "3"
  va_phase_replying: "4"
  va_phase_error: "5"
  va_phase_timer_ringing: "6"
  va_phase_not_ready: "7"

  # Clock styles (the "Clock Style" select in Home Assistant)
  clock_style_digital: "0"
  clock_style_analog: "1"
  clock_style_rooms: "2"
  clock_style_retro: "3"
  clock_style_mario: "4"
  clock_style_photo: "5"
  clock_style_cyber: "6"

# Optional add-ons. Uncomment "packages:" and the add-on(s) you want.
packages:

### Stream the card's mic/line-in to Music Assistant as a Sendspin source
#  micsource:
#    url: https://github.com/RealDeco/SendspinZero
#    ref: main
#    refresh: 1d
#    files: [configs/micsource.yaml]

### LD2410C radar on GPIO35/37/39
  ld2410:
    url: https://github.com/RealDeco/SendspinZero
    ref: main
    refresh: 1d
    files: [configs/ld2410.yaml]

esphome:
  name: s31-function-coreboard
  # Also the player name Sendspin reports to Music Assistant
  friendly_name: S31 Function CoreBoard
  # usb_audio first shipped in 2026.11.0
  min_version: 2026.11.0
  on_boot:
    - priority: -100
      then:
        - micro_wake_word.disable_model: stop
        - script.execute: apply_outputs
        - lvgl.page.show: idle_page
        - lambda: id(display_ready) = true;
        - script.execute: update_mute_icon
        - script.execute:
            id: set_va_phase
            phase: !lambda return id(va_phase);
        - script.execute: apply_accent_color
        - script.execute:
            id: apply_clock_style
            style_mode: !lambda |-
              std::string opt = id(clock_style_choice).current_option();
              if (opt == "Analog Clock") return ${clock_style_analog};
              if (opt == "Rooms") return ${clock_style_rooms};
              if (opt == "Retro") return ${clock_style_retro};
              if (opt == "Mario") return ${clock_style_mario};
              if (opt == "Family Photo") return ${clock_style_photo};
              if (opt == "Cyberclock") return ${clock_style_cyber};
              return ${clock_style_digital};
        - if:
            condition:
              switch.is_on: ethernet_switch
            then:
              - ethernet.enable:
        # The background and the family photo are downloaded, so wait for the network
        - wait_until:
            condition:
              lambda: return network::is_connected();
            timeout: 60s
        - if:
            condition:
              switch.is_on: standby_background_enabled
            then:
              - script.execute: load_standby_background
        - script.execute: load_family_photo

esp32:
  variant: esp32s31
  framework:
    type: esp-idf
    # ESP-IDF 6.1 is the first release with the ESP32-S31 target
    version: 6.1.0
    advanced:
      flash_chip: generic
    sdkconfig_options:
      # Octal PSRAM holds MPLL at 400 MHz, which cannot be divided down to RGMII's 125 MHz; use the Audio PLL
      CONFIG_ETH_EMAC_RGMII_TX_CLK_SRC_APLL: y
  flash_size: 16MB
  # Ethernet setup blocks ~4.8 s at boot; with the display's setup on top, the default 5 s trips the task watchdog
  watchdog_timeout: 15s

psram:
  mode: octal

# Activates the built-in USB-Serial-JTAG logic for direct logging
logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  on_client_connected:
    - delay: 2000ms
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(play_sound)->execute(true, std::string("ready_sound"));
          }
        }

ota:
  - platform: esphome

web_server:
  port: 80
  version: 3

wifi:
  id: wifi_1
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Prefer the wired link; both interfaces must be listed when Wi-Fi and Ethernet are configured together
network:
  priority:
    - ethernet
    - wifi

# Wired Gigabit Ethernet: onboard Motorcomm YT8531 PHY over RGMII. It has its own MAC, so DHCP gives it its own IP.
# Started from on_boot when the "Ethernet" switch is on. Without a cable it retries every 15 s, and each retry
# clears the DNS servers Wi-Fi is using (ESPHome 2026.11.0b7), so keep the switch off when no cable is used.
ethernet:
  id: ethernet_1
  type: YT8531
  mdc_pin: GPIO5
  mdio_pin: GPIO6
  power_pin: GPIO7
  enable_on_boot: false
  # Wi-Fi is only a fallback: off while the wired link has an address, back on when it drops
  on_connect:
    - wifi.disable:
  on_disconnect:
    - wifi.enable:

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - component.update: clock_hms
      - component.update: clock_date

# Clock faces drawn on a canvas; each script only draws while its style is showing
interval:
  - interval: 1s
    then:
      - script.execute: analog_clock_redraw
      - script.execute: retro_clock_redraw
      - script.execute: mario_clock_tick

