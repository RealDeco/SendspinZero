text_sensor:
  - platform: sendspin
    id: sendspin_track_title
    type: title
    name: Track Title
    on_value:
      - component.update: now_playing_text

  - platform: sendspin
    id: sendspin_artist
    type: artist
    name: Artist
    on_value:
      - component.update: now_playing_text

  - platform: sendspin
    id: sendspin_album
    type: album
    name: Album
    on_value:
      - lambda: |-
          id(last_album_art_valid) = id(sendspin_album_art_valid);
          id(sendspin_album_art_valid) = false;
      - component.update: now_playing_text

  # Sendspin pairing code while a pairing is pending (empty otherwise)
  - platform: sendspin
    id: sendspin_pairing_code
    type: pairing_code
    name: Sendspin Pairing Code
    icon: "mdi:numeric"

  # Display: "Title - Artist" under the album art
  - platform: template
    id: now_playing_text
    update_interval: never
    lambda: |-
      std::string s = id(sendspin_track_title).get_state();
      auto a = id(sendspin_artist).get_state();
      if (!a.empty()) {
        if (!s.empty()) s += " - ";
        s += a;
      }
      return s;
    on_value:
      - lvgl.label.update:
          id: now_playing_label
          text: !lambda return x;

  # Display: idle page clocks, date and weather
  - platform: template
    id: clock_hms
    update_interval: 1s
    lambda: |-
      auto t = id(homeassistant_time).now();
      if (!t.is_valid()) return std::string("--:--:--");
      bool show_seconds = id(clock_show_seconds).state;
      int hour_disp = t.hour;
      if (id(clock_12h_format).state) {
        hour_disp = t.hour % 12;
        if (hour_disp == 0) hour_disp = 12;
      }
      bool hide_colons = show_seconds && ((t.second % 2) == 0);
      char buf[16];
      if (show_seconds) {
        if (hide_colons) snprintf(buf, sizeof(buf), "%02d %02d %02d", hour_disp, t.minute, t.second);
        else snprintf(buf, sizeof(buf), "%02d:%02d:%02d", hour_disp, t.minute, t.second);
      } else {
        if (hide_colons) snprintf(buf, sizeof(buf), "%02d %02d", hour_disp, t.minute);
        else snprintf(buf, sizeof(buf), "%02d:%02d", hour_disp, t.minute);
      }
      int h12 = t.hour % 12;
      if (h12 == 0) h12 = 12;
      int next_h12 = (h12 % 12) + 1;
      static const char* cyber_num_words[] = {
        "", "ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE","TEN",
        "ELEVEN","TWELVE","THIRTEEN","FOURTEEN","FIFTEEN","SIXTEEN","SEVENTEEN","EIGHTEEN","NINETEEN","TWENTY"
      };
      auto cyber_minute_words = [&](int m) -> std::string {
        if (m >= 13 && m <= 19) {
          static const char* cyber_teen_stems[] = {"THIR","FOUR","FIF","SIX","SEVEN","EIGHT","NINE"};
          return std::string(cyber_teen_stems[m - 13]) + "\nTEEN";
        }
        if (m <= 20) return std::string(cyber_num_words[m]);
        if (m == 30) return std::string("THIRTY");
        return std::string("TWENTY\n") + cyber_num_words[m - 20];
      };
      std::string cyber_phrase;
      if (t.minute == 0) {
        cyber_phrase = std::string(cyber_num_words[h12]) + "\nO\nCLOCK";
      } else if (t.minute <= 30) {
        cyber_phrase = cyber_minute_words(t.minute) + "\nPAST\n" + cyber_num_words[h12];
      } else {
        cyber_phrase = cyber_minute_words(60 - t.minute) + "\nTO\n" + cyber_num_words[next_h12];
      }
      lv_label_set_text(id(cyber_time_label), cyber_phrase.c_str());
      return std::string(buf);
    on_value:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_digital};'
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda return x;
            - lambda: |-
                if (!id(clock_12h_format).state) {
                  lv_obj_add_flag(id(clock_ampm_label), LV_OBJ_FLAG_HIDDEN);
                  return;
                }
                auto t = id(homeassistant_time).now();
                lv_label_set_text(id(clock_ampm_label), (t.is_valid() && t.hour >= 12) ? "P" : "A");
                lv_point_t txt_size;
                lv_text_get_size(&txt_size, x.c_str(), id(font_7seg)->get_lv_font(), 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                lv_area_t clock_area;
                lv_obj_get_coords(id(clock_label), &clock_area);
                int32_t label_cx = (clock_area.x1 + clock_area.x2) / 2;
                int32_t label_bottom = clock_area.y2;
                lv_obj_set_pos(id(clock_ampm_label), label_cx + txt_size.x / 2 + 1, label_bottom - 14);
                lv_obj_clear_flag(id(clock_ampm_label), LV_OBJ_FLAG_HIDDEN);
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_rooms};'
          then:
            - lvgl.label.update:
                id: rooms_clock_label
                text: !lambda return x;
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_photo};'
          then:
            - lvgl.label.update:
                id: photo_clock_label
                text: !lambda return x;
            - script.execute: photo_ampm_update

  - platform: template
    id: clock_date
    update_interval: 30s
    lambda: |-
      auto t = id(homeassistant_time).now();
      if (!t.is_valid()) return std::string("------");
      static const char* months[] = {
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      };
      const char* mon = (t.month >= 1 && t.month <= 12) ? months[t.month - 1] : "???";
      char buf[32];
      snprintf(buf, sizeof(buf), "%d %s", t.day_of_month, mon);
      return std::string(buf);
    on_value:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_digital};'
          then:
            - lvgl.label.update:
                id: date_label
                text: !lambda return x;
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_rooms};'
          then:
            - lvgl.label.update:
                id: rooms_date_label
                text: !lambda return x;
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_photo};'
          then:
            - lvgl.label.update:
                id: photo_date_label
                text: !lambda return x;

  - platform: template
    id: weather_temp_big
    update_interval: 15s
    lambda: |-
      if (!id(ha_weather_temperature).has_state()) return std::string("--");
      std::string tunit = id(ha_weather_temperature_unit).state.c_str();
      if (tunit.empty()) tunit = "\u00B0C";
      lv_label_set_text(id(weather_big_temp_unit), tunit.c_str());
      int ti = (int) lroundf(id(ha_weather_temperature).state);
      char buf[8];
      snprintf(buf, sizeof(buf), "%d", ti);
      char abuf[16];
      snprintf(abuf, sizeof(abuf), "%d%s", ti, tunit.c_str());
      lv_label_set_text(id(analog_weather_temp), abuf);
      return std::string(buf);
    on_value:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_digital};'
          then:
            - lvgl.label.update:
                id: weather_big_temp
                text: !lambda return x;

  - platform: template
    id: weather_line
    update_interval: 15s
    lambda: |-
      if (!id(ha_weather_temperature).has_state() || !id(ha_weather_wind_speed).has_state()) {
        return std::string("Weather unavailable");
      }
      std::string tunit = id(ha_weather_temperature_unit).state.c_str();
      if (tunit.empty()) tunit = "\u00B0C";
      std::string wunit = id(ha_weather_wind_speed_unit).state.c_str();
      if (wunit.empty()) wunit = "m/s";
      float temp_c = id(ha_weather_temperature).state;
      float wind_ms = id(ha_weather_wind_speed).state;
      float feels_c = temp_c;
      if (temp_c <= 10.0f && wind_ms > 1.3f) {
        float wind_kmh = wind_ms * 3.6f;
        float v16 = powf(wind_kmh, 0.16f);
        feels_c = 13.12f + 0.6215f * temp_c - 11.37f * v16 + 0.3965f * temp_c * v16;
      }
      char buf[160];
      snprintf(buf, sizeof(buf),
               "Temp: %.1f%s  -  Feels like: %.1f%s  -  Wind speed: %.1f %s",
               temp_c, tunit.c_str(),
               feels_c, tunit.c_str(),
               wind_ms, wunit.c_str());
      return std::string(buf);
    on_value:
      - lambda: |-
          id(weather_available) = (x != "Weather unavailable");
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_digital};'
          then:
            - if:
                condition:
                  lambda: return id(weather_available) && id(clock_show_weather).state;
                then:
                  - lvgl.widget.show: weather_header
                else:
                  - lvgl.widget.hide: weather_header
            - if:
                condition:
                  lambda: return id(weather_available) && id(clock_show_feels_like).state;
                then:
                  - lvgl.widget.show: weather_label
                  - lvgl.label.update:
                      id: weather_label
                      text: !lambda return x;
                else:
                  - lvgl.widget.hide: weather_label
          else:
            - lvgl.widget.hide: weather_header
            - lvgl.widget.hide: weather_label
      - if:
          condition:
            and:
              - lvgl.page.is_showing: idle_page
              - lambda: 'return id(clock_style_mode) == ${clock_style_analog};'
              - lambda: return id(weather_available) && id(clock_show_weather).state;
          then:
            - lvgl.widget.show: analog_weather_icon
            - lvgl.widget.show: analog_weather_temp
          else:
            - lvgl.widget.hide: analog_weather_icon
            - lvgl.widget.hide: analog_weather_temp

  - platform: homeassistant
    id: ha_weather_condition
    entity_id: ${ha_weather_entity}
    on_value:
      - lambda: |-
          const char* icon = "\U000F0590";
          auto c = id(ha_weather_condition).state;
          if (c == "sunny" || c == "clear") {
            icon = "\U000F0599";
          } else if (c == "partlycloudy") {
            icon = "\U000F0595";
          } else if (c == "cloudy") {
            icon = "\U000F0590";
          } else if (c == "rainy") {
            icon = "\U000F0597";
          } else if (c == "pouring") {
            icon = "\U000F0596";
          } else if (c == "snowy") {
            icon = "\U000F0598";
          } else if (c == "lightning") {
            icon = "\U000F0593";
          } else if (c == "hail") {
            icon = "\U000F0592";
          }
          lv_label_set_text(id(weather_icon), icon);
          lv_label_set_text(id(analog_weather_icon), icon);

  - platform: homeassistant
    id: ha_weather_temperature_unit
    entity_id: ${ha_weather_entity}
    attribute: temperature_unit

  - platform: homeassistant
    id: ha_weather_wind_speed_unit
    entity_id: ${ha_weather_entity}
    attribute: wind_speed_unit

  # Which link is carrying the device: Ethernet when connected, otherwise Wi-Fi
  - platform: template
    name: "Network Connection"
    icon: "mdi:network"
    entity_category: "diagnostic"
    update_interval: 10s
    lambda: |-
      if (id(ethernet_1).is_connected()) return std::string("Ethernet");
      if (id(wifi_1).is_connected()) return std::string("WiFi");
      return std::string("Connecting");

  - platform: ethernet_info
    ip_address:
      name: "Ethernet IP Address"
      entity_category: "diagnostic"

  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      entity_category: "diagnostic"

sensor:
  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: ${ha_weather_entity}
    attribute: temperature

  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: ${ha_weather_entity}
    attribute: wind_speed

  - platform: internal_temperature
    name: "ESP Temperature"
    entity_category: "diagnostic"

  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: "diagnostic"

  # Headroom for audio alongside Bluetooth; hidden in Home Assistant, readable on the web page
  - platform: debug
