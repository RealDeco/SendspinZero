    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - component.update: clock_hms
      - script.execute: retro_clock_redraw
      - script.execute:
          id: mario_draw_scene
          full_redraw: true
    on_turn_off:
      - component.update: clock_hms
      - script.execute: retro_clock_redraw
      - script.execute:
          id: mario_draw_scene
          full_redraw: true

  # Re-applies the style, so every clock that has a date shows or hides it
  - platform: template
    id: clock_show_date
    name: Show Date
    icon: "mdi:calendar-blank-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - if:
          condition:
