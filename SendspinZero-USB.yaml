substitutions:
  name: sendspinzero-usb
  friendly_name: SendspinZero-USB
  micsource_microphone: usb_mic  # Used by the micsource package

  # The USB card's audio formats; the card must support them exactly, or the log lists what it does
  usb_sample_rate: "48000"  # Speaker, Hz: 44100 or 48000 (the resamplers and pipelines stop at 48000)
  usb_bits_per_sample: "24"  # Speaker, bits: 16 or 24 (also what Music Assistant sends)
  usb_mic_sample_rate: "48000"  # Mic, Hz
  usb_mic_bits_per_sample: "24"  # Mic, bits
  usb_mic_channels: "2"  # Mic, 1 or 2 (some cards only offer 1 channel)

# usb_audio supports UAC 1.0 only; a UAC 2.0 device is rejected
# Optional: stream the card's mic/line-in to Music Assistant as a Sendspin source. Comment out to remove it.
packages:
  micsource:
    url: https://github.com/RealDeco/SendspinZero
    ref: main
    refresh: 1d
    files: [configs/micsource.yaml]

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # usb_audio first shipped in 2026.11.0
  min_version: 2026.11.0
  name_add_mac_suffix: false
  project:
    name: realdeco.zero_usb
    version: "2026.11.0"

esp32:
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE: "4096" #needed for fun generation ua202
psram:
  mode: quad
  speed: 80MHz

api:
  on_client_connected:
    - delay: 2000ms
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(speaker_media_player)
              ->make_call()
              .set_media_url("audio-file://ready_sound")
              .set_announcement(true)
              .perform();
          }
        }

ota:
  - platform: esphome
    id: ota_esphome

logger:
  level: INFO  # Shows USB card connects/disconnects and, on a format mismatch, the formats the card supports
  hardware_uart: UART0  # USB-Serial-JTAG is gone once usb_host starts

wifi:
  ap:

improv_serial:

captive_portal:

globals:
  - id: boot_sound_played
    type: bool
    restore_value: no
    initial_value: "false"

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

  - platform: template
    id: sendspin_confirm_pairing
    name: "Sendspin Confirm Pairing"
    icon: mdi:link-variant
    entity_category: config
    on_press:
      - sendspin.confirm_pairing_window: sendspin_hub

text_sensor:
  - platform: sendspin
    id: sendspin_pairing_code
    type: pairing_code
    name: "Sendspin Pairing Code"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
      inverted: true
    id: center_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - media_player.toggle: sendspin_group_media_player

      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

usb_audio:
  id: usb_audio_hub

microphone:
  - platform: usb_audio
    id: usb_mic
    sample_rate: ${usb_mic_sample_rate}
    bits_per_sample: ${usb_mic_bits_per_sample}bit
    num_channels: ${usb_mic_channels}

speaker:
  - platform: usb_audio
    id: usb_speaker
    sample_rate: ${usb_sample_rate}
    bits_per_sample: ${usb_bits_per_sample}bit
    num_channels: 2

  - platform: mixer
    id: usb_mixer
    output_speaker: usb_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: usb_announcement_input
      - id: usb_media_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: usb_announcement_input
    sample_rate: ${usb_sample_rate}
    bits_per_sample: ${usb_bits_per_sample}

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: usb_media_input
    sample_rate: ${usb_sample_rate}
    bits_per_sample: ${usb_bits_per_sample}

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false
  on_pairing_failed:
    - logger.log:
        format: "Sendspin pairing failed: %s"
        args: ["reason.c_str()"]
        level: WARN

audio_file:
  - id: ready_sound
    file: https://github.com/RealDeco/xiaozhi-esphome/raw/main/sounds/popup.flac

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
  - platform: audio_http
    id: http_media_source
  - platform: sendspin
    id: sendspin_media_source
    static_delay_adjustable: true
    sample_rate: ${usb_sample_rate}
    bits_per_sample: ${usb_bits_per_sample}
    codecs: [flac, pcm]  # Opus left out to save flash

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    name: None
    id: speaker_media_player

    announcement_pipeline:
      format: FLAC
      sample_rate: ${usb_sample_rate}
      num_channels: 1
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source

    media_pipeline:
      format: FLAC
      sample_rate: ${usb_sample_rate}
      num_channels: 2
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05

    on_announcement:
      - mixer_speaker.apply_ducking:
          id: usb_media_input
          decibel_reduction: 20
          duration: 0.0s

    on_play:
      - script.stop: mp_idle_debounce
      - script.execute: music_led

    on_idle:
      - script.execute: mp_idle_debounce

    on_pause:
      - script.execute: mp_idle_debounce

    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing:
                id: speaker_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: usb_media_input
                decibel_reduction: 0
                duration: 1.0s

script:
  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            or:
              - media_player.is_idle: speaker_media_player
              - media_player.is_paused: speaker_media_player
          then:
            - light.turn_off: led

  - id: music_led
    then:
      - if:
          condition:
            switch.is_on: use_music_light
          then:
            - light.turn_on:
                id: led
                blue: 0%
                red: 0%
                green: 100%
                effect: "Slow Pulse"
          else:
            - light.turn_off: led

switch:
  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Use music light
    id: use_music_light
    icon: "mdi:music-note"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - if:
          condition:
            media_player.is_playing: speaker_media_player
          then:
            - script.execute: music_led
    on_turn_off:
      - light.turn_off: led

  - platform: sendspin
    id: sendspin_unpaired_access
    type: unpaired_access
    name: "Sendspin Unpaired Access"
    restore_mode: RESTORE_DEFAULT_ON

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: LED
    disabled_by_default: false
    entity_category: config
    pin: GPIO21
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    channel_colors: GRB
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
